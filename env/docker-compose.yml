# Topology per DESIGN 3: one control node + db nodes n1..n7 on a single
# bridge network with service-name hostnames. n6/n7 exist but run no SUT in
# M0 (the membership pool). Always drive this file through env/run.sh — it
# generates the ssh keypair the volume mounts below rely on.

name: ratis-jepsen

x-common: &common
  image: ratis-jepsen/env:latest
  pull_policy: never
  networks:
    - jepsen

# db nodes: privileged for fault injection (iptables partitions, SIGSTOP,
# later FUSE experiments); they trust control's generated public key.
x-db-node: &db-node
  <<: *common
  privileged: true
  volumes:
    - ./.state/ssh/id_ed25519.pub:/root/.ssh/authorized_keys:ro

services:
  control:
    <<: *common
    build: .
    container_name: ratis-jepsen-control
    hostname: control
    volumes:
      # the repository, read-write, on control only (harness + SUT build)
      - ..:/ratis-jepsen
      # control's identity for root@nX
      - ./.state/ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      # persist Maven/Clojure downloads across validate runs within one
      # up-cycle; removed by `run.sh down` (down --volumes), so cycles stay
      # state-free
      - maven-repo:/root/.m2

  n1:
    <<: *db-node
    container_name: ratis-jepsen-n1
    hostname: n1
  n2:
    <<: *db-node
    container_name: ratis-jepsen-n2
    hostname: n2
  n3:
    <<: *db-node
    container_name: ratis-jepsen-n3
    hostname: n3
  n4:
    <<: *db-node
    container_name: ratis-jepsen-n4
    hostname: n4
  n5:
    <<: *db-node
    container_name: ratis-jepsen-n5
    hostname: n5
  n6:
    <<: *db-node
    container_name: ratis-jepsen-n6
    hostname: n6
  n7:
    <<: *db-node
    container_name: ratis-jepsen-n7
    hostname: n7

networks:
  jepsen:
    driver: bridge

volumes:
  maven-repo:
